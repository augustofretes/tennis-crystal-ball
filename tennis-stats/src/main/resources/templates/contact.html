<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: commonHead(~{::title/text()}, false, ~{::template})">
	<title>Feedback &amp; contributions</title>
	<template>
	<meta name="description" content="Report an issue, suggest an improvement, or contribute to this Ultimate Tennis Statistics fork."/>
	</template>
</head>
<body class="container">
	<header th:include="fragments/header :: title"></header>
	<main class="club-contact">
		<p class="club-eyebrow">Help improve the reference</p>
		<h1>Feedback &amp; contributions</h1>
		<p>Found a data issue or have an idea for the app? <a href="https://github.com/augustofretes/tennis-crystal-ball/issues" target="_blank" rel="noopener noreferrer">Open an issue</a> with the player, match, or page involved and what you expected to see.</p>
		<p>To contribute a fix or improvement, visit <a href="https://github.com/augustofretes/tennis-crystal-ball" target="_blank" rel="noopener noreferrer">this fork's source repository</a>.</p>
	</main>
	<footer th:include="fragments/footer :: copy"></footer>
