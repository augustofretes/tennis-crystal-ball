# Production web service. Railway service: tennis-stats; branch: master.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "java -XX:MaxRAMPercentage=70 -cp '/app/lib/*' org.strangeforest.tcb.stats.TennisStatsApplication"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
